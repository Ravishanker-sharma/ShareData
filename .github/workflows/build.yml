name: Build Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download cloudflared
        run: |
          curl -L -o cloudflared-windows-amd64.exe `
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShareData-Windows
          path: dist/ShareData.exe
          retention-days: 30

  # ── macOS (Apple Silicon + Intel) ────────────────────────────────────────
  build-macos:
    runs-on: macos-latest        # Apple Silicon (M-series) runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download cloudflared
        run: |
          curl -L -o cloudflared-darwin-arm64 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64
          chmod +x cloudflared-darwin-arm64

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r ShareData-macOS.zip ShareData.app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShareData-macOS
          path: dist/ShareData-macOS.zip
          retention-days: 30